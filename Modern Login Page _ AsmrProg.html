                </div>
                <span>or use your email for registeration</span>
                <input type="text" id="signupName" placeholder="Name">
                <input type="email" id="signupEmail" placeholder="Email">
                <input type="password" id="signupPassword" placeholder="Password">
                <button type="button" id="signupBtn">Sign Up</button>
            </form>
        </div>

        <!-- Formulaire Connexion (Sign In) -->
        <div class="form-container sign-in">
            <form onsubmit="return false;">
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="http://127.0.0.1:5500/config/public/login.html#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>

                    <a href="http://127.0.0.1:5500/config/public/login.html#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>or use your email password</span>
                <input type="email" id="signinEmail" placeholder="Email">
                <input type="password" id="signinPassword" placeholder="Password">
                <a href="http://127.0.0.1:5500/config/public/login.html#">Forget Your Password?</a>
                <button type="button" id="signinBtn">Sign In</button>
            </form>
        </div>

        <!-- Conteneur de basculement (Panneau glissant) -->
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Enter your personal details to use all of site features</p>
                    <button class="hidden" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Welcome!</h1>
                    <p>Register with your personal details to use all of site features</p>
                    <button class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
