<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="ss.css">
    <title>Modern Login Page | AsmrProg</title>
</head>

<body>

    <div class="container" id="container">
        <div class="form-container sign-up">
            <form onsubmit="return false;">
                <h1>Create Account</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>or use your email for registeration</span>
                <input type="text" id="signupName" placeholder="Name">
                <input type="email" id="signupEmail" placeholder="Email">
                <input type="password" id="signupPassword" placeholder="Password">
                <button type="button" id="signupBtn">Sign Up</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form onsubmit="return false;">
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>or use your email password</span>
                <input type="email" id="signinEmail" placeholder="Email">
                <input type="password" id="signinPassword" placeholder="Password">
                <a href="#">Forget Your Password?</a>
                <button type="button" id="signinBtn">Sign In</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Enter your personal details to use all of site features</p>
                    <button class="hidden" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Welcome!</h1>
                    <p>Register with your personal details to use all of site features</p>
                    <button class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    <!-- Firebase Auth -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCv_NLOCXb3ApTMSjxsIDLbYrUr1Ymi-rA",
            authDomain: "smart-room-c163c.firebaseapp.com",
            databaseURL: "https://smart-room-c163c-default-rtdb.firebaseio.com",
            projectId: "smart-room-c163c",
            storageBucket: "smart-room-c163c.firebasestorage.app",
            messagingSenderId: "552350325154",
            appId: "1:552350325154:web:4cbe5619639f844d7dbafb",
            measurementId: "G-7DY5JE1SR4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ===== SIGN UP =====
        document.getElementById("signupBtn").addEventListener("click", async () => {
            const name = document.getElementById("signupName").value;
            const email = document.getElementById("signupEmail").value;
            const password = document.getElementById("signupPassword").value;

            if (!name || !email || !password) {
                alert("Merci de remplir tous les champs");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await setDoc(doc(db, "utilisateurs", user.uid), {
                    nom: name,
                    email: email,
                    role: "Employé",
                    actif: true
                });

                alert("Compte créé avec succès !");
                window.location.href = "../page/project.html";
            } catch (error) {
                alert("Erreur : " + error.message);
            }
        });

        // ===== SIGN IN =====
        document.getElementById("signinBtn").addEventListener("click", async () => {
            const email = document.getElementById("signinEmail").value;
            const password = document.getElementById("signinPassword").value;

            if (!email || !password) {
                alert("Merci de remplir tous les champs");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Connexion réussie !");
                window.location.href = "../page/project.html";
            } catch (error) {
                alert("Erreur : " + error.message);
            }
        });
    </script>

</body>

</html>
